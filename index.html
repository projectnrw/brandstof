<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diesel"><meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brandstof Kleve</title><style>
:root{--bg:#fff;--fg:#111;--mut:#666;--ln:#ddd}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e5e7eb;--mut:#94a3b8;--ln:#334155}}
body{margin:0;padding:env(safe-area-inset-top) 12px 24px;background:var(--bg);color:var(--fg);font:15px -apple-system,system-ui,sans-serif}
h1{font-size:22px}h2{font-size:17px;margin-top:24px}table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
.n{text-align:right;white-space:nowrap}.m{color:var(--mut);font-size:12px}.up{color:#ef4444}.dn{color:#22c55e}svg{width:100%;height:auto}
</style></head><body><h1>⛽ Brandstof Kleve</h1><div id="a">Laden…</div><script>
const f=(x,d=3)=>x==null?'–':x.toFixed(d).replace('.',',');
function chart(series,labels){const W=340,H=160,P=28,all=series.flatMap(s=>s.v).filter(x=>x!=null);if(!all.length)return'';
const mn=Math.min(...all),mx=Math.max(...all),n=labels.length,X=i=>P+(W-P-4)*(n<2?0:i/(n-1)),Y=v=>H-18-(H-26)*(mx==mn?.5:(v-mn)/(mx-mn));
let s=`<svg viewBox="0 0 ${W} ${H}"><text x="0" y="12" font-size="10" fill="currentColor">${f(mx,2)}</text><text x="0" y="${H-18}" font-size="10" fill="currentColor">${f(mn,2)}</text>`;
for(const se of series){const pts=se.v.map((v,i)=>v==null?null:X(i)+','+Y(v)).filter(Boolean);s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" points="${pts.join(' ')}"/>`}
s+=`<text x="${P}" y="${H-3}" font-size="10" fill="currentColor">${labels[0]}</text><text x="${W-4}" y="${H-3}" font-size="10" text-anchor="end" fill="currentColor">${labels[n-1]}</text></svg>`;return s}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{let h=`<p class="m">Meting: ${(d.diesel_at||'').replace('T',' ')}</p><table><tr><th>Station</th><th class="n">€/l</th><th class="n">Δ</th></tr>`;
for(const s of d.stations)h+=`<tr><td>${s.brand}<div class="m">${s.street}, ${s.city.replace(/^\d+ /,'')}</div></td><td class="n">${s.price==null?'gesloten':f(s.price)}</td><td class="n ${s.diff>0?'up':s.diff<0?'dn':''}">${s.diff==null?'–':(s.diff>0?'+':'')+f(s.diff)}</td></tr>`;
h+=`</table><h2>Goedkoopste diesel over tijd</h2>`+chart([{v:d.cheapest.map(c=>c.p),c:'#f59e0b'}],d.cheapest.map(c=>c.t.slice(5,16).replace('T',' ')));
const o=d.oil.slice(-120);h+=`<h2>Olieprijs (USD/vat)</h2><p class="m"><span style="color:#3b82f6">■ Brent</span> ${f(o.at(-1)?.brent,2)} &nbsp; <span style="color:#a855f7">■ WTI</span> ${f(o.at(-1)?.wti,2)} (${o.at(-1)?.d||''})</p>`+chart([{v:o.map(x=>x.brent),c:'#3b82f6'},{v:o.map(x=>x.wti),c:'#a855f7'}],o.map(x=>x.d))+`<p class="m">Bron: tankerkoenig/clever-tanken, FRED. Bijgewerkt ${d.generated.replace('T',' ')}</p>`;
document.getElementById('a').innerHTML=h}).catch(e=>a.textContent='Fout bij laden: '+e)
</script></body></html>
